<!DOCTYPE html>
<html>
<head>
    <title>3D Sniper: NEON PLUTO - MOBILE EDITION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #87CEEB; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        /* UI Elements */
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 12px; border: 4px solid #000; z-index: 20; font-size: 13px; box-shadow: 6px 6px 0px #000; width: 220px; }
        #minimap { position: absolute; top: 10px; right: 10px; width: 140px; height: 140px; background: rgba(255,255,255,0.8); border: 4px solid #000; z-index: 20; box-shadow: 4px 4px 0px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; border: 2px solid red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        
        /* Scope Effect */
        #scope-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; opacity: 0; background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%); transition: 0.1s; }
        .scoped #scope-vignette { opacity: 1; }
        
        /* Overlay */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #fff; flex-direction: column; z-index: 100; text-align: center; }
        button.main-btn { padding: 20px 60px; font-size: 24px; background: #000; color: #fff; border: none; cursor: pointer; box-shadow: 6px 6px 0px #00ffcc; font-family: 'Arial Black', sans-serif; }
        #invincible-msg { color: red; font-weight: bold; display: none; }

        /* Mobile Controls */
        #mobile-controls { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; z-index: 50; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(0,0,0,0.2); border: 4px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; }
        #joystick-knob { position: absolute; top: 36px; left: 36px; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        #scope-btn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(0,0,0,0.5); color: #fff; border: 4px solid rgba(255,255,255,0.5); border-radius: 50%; font-weight: bold; pointer-events: auto; font-family: 'Arial Black', sans-serif; }
        
        /* Show mobile controls on smaller screens */
        @media (max-width: 1024px) {
            #mobile-controls { display: block; }
            #minimap { width: 100px; height: 100px; } /* Shrink minimap on phones */
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <canvas id="minimap" width="180" height="180"></canvas>
    
    <div id="ui">
        <b id="time-ui">TIME: 0s</b><br>
        SCORE: <span id="score-val">0</span><br>
        AMMO: <span id="ammo">200</span> | ❤ <span id="lives-val">3</span><br>
        <span id="invincible-msg">INVINCIBLE!</span>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <button id="scope-btn">SCOPE</button>
    </div>

    <div id="crosshair"></div>
    <div id="scope-vignette"></div>
    
    <div id="overlay">
        <h1>3D NEON PLUTO</h1>
        <p style="font-size: 18px; max-width: 80%;">
            <b>PC:</b> WASD to move, Mouse to look/shoot, Shift to scope.<br><br>
            <b>Mobile:</b> Left joystick to move, Drag right screen to look, Tap right screen to shoot!
        </p>
        <button id="start-btn" class="main-btn">START GAME</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playShoot() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        let lives = 3, ammo = 200, score = 0, gameOver = true, isZoomed = false;
        let startTime = 0, difficultyMult = 1.0, invincibilityTimer = 0;
        
        // Touch Variables
        let touchMoveID = null, touchLookID = null;
        let joyStartX = 0, joyStartY = 0, joyX = 0, joyY = 0;
        let lookPrevX = 0, lookPrevY = 0, isDraggingLook = false;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 1500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.5));
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({color: 0xffffff}));
        ground.rotation.x = -Math.PI/2;
        scene.add(ground);

        const mCanvas = document.getElementById('minimap');
        const mctx = mCanvas.getContext('2d');

        let gems=[], killers=[], projectiles=[], buildings=[], bombs=[], particles=[];

        function createKiller() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 4), new THREE.MeshStandardMaterial({color: 0x333333}));
            body.position.y = 5; group.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshStandardMaterial({color: 0x000000}));
            head.position.y = 12; group.add(head);
            return group;
        }

        function explode(pos) {
            for(let i=0; i<10; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshBasicMaterial({color: 0x333333}));
                p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2.5, (Math.random()-0.5)*2).multiplyScalar(60);
                particles.push({mesh: p, vel: vel, life: 1.0});
                scene.add(p);
            }
        }

        function spawn() {
            [gems, killers, projectiles, buildings, bombs, particles].forEach(a => a.forEach(o => scene.remove(o.mesh || o)));
            gems=[]; killers=[]; projectiles=[]; buildings=[]; bombs=[]; particles=[];
            const neonColors = [0xff00ff, 0x00d2ff, 0x33ffaa, 0xffaa00];
            for(let i=0; i<400; i++) {
                let h = Math.random() * 120 + 20;
                const col = neonColors[Math.floor(Math.random() * neonColors.length)];
                const b = new THREE.Mesh(new THREE.BoxGeometry(25, h, 25), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.2}));
                b.position.set(Math.random()*4000-2000, h/2, Math.random()*4000-2000);
                if(b.position.length() > 150) { scene.add(b); buildings.push(b); }
            }
            for(let i=0; i<75; i++) {
                const k = createKiller();
                k.position.set(Math.random()*3600-1800, 0, Math.random()*3600-1800);
                scene.add(k); killers.push(k);
            }
            for(let i=0; i<120; i++) {
                const g = new THREE.Mesh(new THREE.OctahedronGeometry(4), new THREE.MeshStandardMaterial({color: 0x00ffff}));
                g.position.set(Math.random()*3000-1500, 5, Math.random()*3000-1500);
                scene.add(g); gems.push(g);
            }
            for(let i=0; i<60; i++) {
                const b = new THREE.Mesh(new THREE.IcosahedronGeometry(4), new THREE.MeshStandardMaterial({color: 0xff4400}));
                b.position.set(Math.random()*3000-1500, 4, Math.random()*3000-1500);
                scene.add(b); bombs.push(b);
            }
        }

        // --- CONTROLS: PC ---
        let keys = {};
        window.onkeydown = (e) => { keys[e.code] = true; if(e.code.includes('Shift')) isZoomed=true; };
        window.onkeyup = (e) => { keys[e.code] = false; if(e.code.includes('Shift')) isZoomed=false; };
        window.addEventListener('mousemove', (e) => { 
            if(document.pointerLockElement) { 
                camera.rotation.y -= e.movementX * 0.003; 
                camera.rotation.x -= e.movementY * 0.003; 
                camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x)); 
            } 
        });
        window.onmousedown = (e) => { 
            if(!gameOver && e.target.tagName !== 'BUTTON') fire(); 
        };

        // --- CONTROLS: MOBILE TOUCH ---
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        const scopeBtn = document.getElementById('scope-btn');

        scopeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isZoomed = !isZoomed; }, {passive: false});

        window.addEventListener('touchstart', (e) => {
            if(gameOver) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if(t.target === joyZone || t.target === joyKnob) {
                    touchMoveID = t.identifier;
                    let rect = joyZone.getBoundingClientRect();
                    joyStartX = rect.left + rect.width/2;
                    joyStartY = rect.top + rect.height/2;
                    updateJoystick(t.clientX, t.clientY);
                } else if(t.clientX > window.innerWidth / 2 && t.target !== scopeBtn) {
                    // Right side of screen for aiming
                    touchLookID = t.identifier;
                    lookPrevX = t.clientX;
                    lookPrevY = t.clientY;
                    isDraggingLook = false;
                }
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if(gameOver) return;
            e.preventDefault(); // Prevent scrolling on mobile
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if(t.identifier === touchMoveID) {
                    updateJoystick(t.clientX, t.clientY);
                } else if(t.identifier === touchLookID) {
                    let dx = t.clientX - lookPrevX;
                    let dy = t.clientY - lookPrevY;
                    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) isDraggingLook = true;
                    
                    camera.rotation.y -= dx * 0.005;
                    camera.rotation.x -= dy * 0.005;
                    camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
                    
                    lookPrevX = t.clientX;
                    lookPrevY = t.clientY;
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if(t.identifier === touchMoveID) {
                    touchMoveID = null;
                    joyX = 0; joyY = 0;
                    joyKnob.style.transform = `translate(0px, 0px)`;
                } else if(t.identifier === touchLookID) {
                    touchLookID = null;
                    if(!isDraggingLook && !gameOver) fire(); // Tap to fire
                }
            }
        });

        function updateJoystick(cx, cy) {
            let dx = cx - joyStartX;
            let dy = cy - joyStartY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxDist = 40; // Max drag distance for knob
            if(dist > maxDist) {
                dx = (dx/dist) * maxDist;
                dy = (dy/dist) * maxDist;
            }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxDist;
            joyY = dy / maxDist;
        }

        // --- GAME LOGIC ---
        document.getElementById('start-btn').onclick = () => {
            audioCtx.resume(); 
            lives=3; ammo=200; score=0; invincibilityTimer = 0; gameOver=false; 
            isZoomed = false; // Reset zoom state
            startTime = Date.now();
            document.getElementById('score-val').innerText = "0";
            document.getElementById('lives-val').innerText = "3";
            document.getElementById('overlay').style.display='none';
            spawn(); 
            camera.position.set(0, 10, 0);
            if(window.innerWidth > 1024) document.body.requestPointerLock();
        };

        function fire() {
            if(ammo <= 0) return;
            ammo--; document.getElementById('ammo').innerText = ammo;
            playShoot();
            const p = new THREE.Mesh(new THREE.SphereGeometry(1.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
            p.position.copy(camera.position);
            const d = new THREE.Vector3(); camera.getWorldDirection(d);
            projectiles.push({mesh: p, vel: d.multiplyScalar(3000)});
            scene.add(p);
        }

        function updateMinimap() {
            mctx.clearRect(0,0,180,180);
            const scale = 0.04; 
            mctx.fillStyle = "black";
            killers.forEach(k => mctx.fillRect(90+k.position.x*scale-2, 90+k.position.z*scale-2, 4, 4));
            mctx.fillStyle = "cyan";
            gems.forEach(g => mctx.fillRect(90+g.position.x*scale-1, 90+g.position.z*scale-1, 3, 3));
            mctx.fillStyle = "orange";
            bombs.forEach(b => mctx.fillRect(90+b.position.x*scale-1, 90+b.position.z*scale-1, 2, 2));
            mctx.fillStyle = "red";
            mctx.beginPath(); mctx.arc(90+camera.position.x*scale, 90+camera.position.z*scale, 4, 0, Math.PI*2); mctx.fill();
        }

        function loop() {
            requestAnimationFrame(loop);
            if(gameOver) return;
            const dt = 0.016;
            
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            difficultyMult = 1.0 + (elapsed * 0.025);
            document.getElementById('time-ui').innerText = `TIME: ${elapsed}s`;
            
            if(invincibilityTimer > 0) {
                invincibilityTimer -= dt;
                document.getElementById('invincible-msg').style.display = 'inline';
                renderer.domElement.style.opacity = Math.sin(Date.now()*0.02) > 0 ? "0.5" : "1";
            } else {
                document.getElementById('invincible-msg').style.display = 'none';
                renderer.domElement.style.opacity = "1";
            }

            camera.fov += ((isZoomed ? 15 : 75) - camera.fov) * 0.25;
            camera.updateProjectionMatrix();
            document.body.classList.toggle('scoped', isZoomed);

            // Combine Keyboard AND Mobile Joystick inputs
            let kz = (keys['KeyW'] || keys['ArrowUp'] ? -1 : 0) + (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) + joyY;
            let kx = (keys['KeyA'] || keys['ArrowLeft'] ? -1 : 0) + (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) + joyX;
            
            // Clamp speed so diagonal joystick isn't faster
            kz = Math.max(-1, Math.min(1, kz));
            kx = Math.max(-1, Math.min(1, kx));

            camera.translateZ(kz * 160 * difficultyMult * dt);
            camera.translateX(kx * 160 * difficultyMult * dt);
            camera.position.y = 10;

            particles.forEach((p, i) => {
                p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
                p.vel.y -= 3.0;
                p.life -= dt * 1.5;
                p.mesh.scale.set(p.life, p.life, p.life);
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            });

            projectiles.forEach((p, i) => {
                p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
                killers.forEach(k => { 
                    if(p.mesh.position.distanceTo(k.position) < 40) { 
                        score += 100; document.getElementById('score-val').innerText = score;
                        explode(k.position);
                        k.position.set(Math.random()*3600-1800, 0, Math.random()*3600-1800);
                        scene.remove(p.mesh); projectiles.splice(i,1);
                    }
                });
                if(p.mesh && p.mesh.position.length() > 4500) { scene.remove(p.mesh); projectiles.splice(i,1); }
            });

            gems.forEach((g, gi) => {
                g.rotation.y += 0.1;
                if(camera.position.distanceTo(g.position) < 18) {
                    score += 50; document.getElementById('score-val').innerText = score;
                    scene.remove(g); gems.splice(gi, 1);
                }
            });

            killers.forEach(k => {
                const dist = camera.position.distanceTo(k.position);
                if(dist < 1200) {
                    k.lookAt(camera.position.x, 0, camera.position.z);
                    k.position.add(new THREE.Vector3().subVectors(camera.position, k.position).normalize().multiplyScalar(75 * difficultyMult * dt));
                }
                if(dist < 15 && invincibilityTimer <= 0) resetPlayer();
            });

            bombs.forEach(b => { 
                if(camera.position.distanceTo(b.position) < 15 && invincibilityTimer <= 0) resetPlayer(); 
            });
            
            updateMinimap();
            renderer.render(scene, camera);
        }

        // Handle window resize dynamically
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function resetPlayer() {
            lives--; 
            document.getElementById('lives-val').innerText = lives; 
            invincibilityTimer = 2.0; 
            camera.position.set(0, 10, 0); 
            if(lives <= 0) { 
                gameOver = true; 
                document.getElementById('overlay').style.display = 'flex'; 
                document.getElementById('overlay').querySelector('h1').innerText = "GAME OVER";
                document.exitPointerLock(); 
            }
        }
        loop();
    </script>
</body>
</html>
